name: Verify digital studies
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_manifest.py
      - run: python scripts/verify_stage1_specification.py
      - run: python scripts/run_studies.py
      - run: python scripts/build_firmware.py
      - run: python scripts/run_adapter.py
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-study-results
          path: results/
