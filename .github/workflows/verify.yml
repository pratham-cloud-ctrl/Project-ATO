name: Verify digital studies
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/verify_manifest.py
      - run: python scripts/verify_stage1_specification.py
      - run: python scripts/run_architecture_budgets.py --check
      - run: python scripts/verify_stage2_architecture.py
      - run: python scripts/verify_stage3_foundation.py
      - run: python scripts/verify_stage3_continuation.py
      - run: python scripts/run_studies.py
      - run: python scripts/build_firmware.py
      - run: python scripts/run_adapter.py
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-study-results
          path: results/

  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - study: foundation
            commands: |
              python scripts/run_stage3_studies.py --check --jobs 2
              python scripts/stage3_electrical_sweep.py --check results/stage3/electrical-sweep.json
              python scripts/stage3_pressure_convergence_probe.py --check results/stage3/pressure-convergence-probe.json
          - study: motor-numerics
            commands: python scripts/stage3_motor_convergence.py --check results/stage3/numerical/motor-convergence.json.gz
          - study: pressure-numerics
            commands: python scripts/stage3_pressure_convergence.py --check results/stage3/numerical/pressure-convergence.json.gz --summary-check results/stage3/numerical/pressure-convergence-summary.json --jobs 2
          - study: information
            commands: python scripts/stage3_information_comparison.py --check --jobs 2
          - study: response-domain
            commands: python scripts/stage3_response_validation.py --check results/stage3/response-validation/response-domain-raw.json.gz --summary-check results/stage3/response-validation/response-domain-summary.json --jobs 2
          - study: acquisition-cue-expert
            commands: |
              python scripts/stage3_acquisition_qualification.py --check results/stage3/numerical/acquisition-qualification.json.gz
              python scripts/stage3_cue_policy_study.py --check results/stage3/cue-policy/raw.json.gz
              python scripts/stage3_expert_validation.py --check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: ${{ matrix.commands }}

  verify:
    if: always()
    needs: [audit, reproduce]
    runs-on: ubuntu-latest
    steps:
      - name: Require artifact audit and every study reproduction
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          REPRODUCTION_RESULT: ${{ needs.reproduce.result }}
        run: |
          test "$AUDIT_RESULT" = success
          test "$REPRODUCTION_RESULT" = success
